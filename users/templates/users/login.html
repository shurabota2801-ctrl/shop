<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
</head>
<body>
    <h1>Вход</h1>

    <form method="post">
        {% csrf_token %}

        {{ form.non_field_errors }}

        <p>
            <label for="{{ form.username.id_for_label }}">Логин</label>
            {{ form.username }}
            {{ form.username.errors }}
        </p>

        <p>
            <label for="{{ form.password.id_for_label }}">Пароль</label>
            {{ form.password }}
            {{ form.password.errors }}
        </p>

        <button type="submit">Войти</button>
    </form>
</body>
</html>
